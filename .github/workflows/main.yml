name: Tailscale Windows Test

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance Number"
        required: true
        default: "1"
        type: string

jobs:
  test-tailscale:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=== WINDOWS RUNNER ===" -ForegroundColor Green
          Write-Host "Instance: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
          Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
          Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow

          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory

      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Downloading Tailscale..." -ForegroundColor Green

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Write-Host "Installing Tailscale..." -ForegroundColor Green

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {
            Write-Host "Tailscale executable not found." -ForegroundColor Red
            exit 1
          }

          Write-Host "Tailscale installed successfully!" -ForegroundColor Green

      - name: Start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "Starting Tailscale..." -ForegroundColor Green

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Host "TAILSCALE_AUTH_KEY secret is missing." -ForegroundColor Red
            exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          $hostname = "github-${{ github.run_id }}"

          & $tailscale up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Tailscale failed to start." -ForegroundColor Red
            exit $LASTEXITCODE
          }

          Start-Sleep -Seconds 10

          Write-Host "Tailscale started successfully!" -ForegroundColor Green

      - name: Check Tailscale Status
        shell: powershell
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "=== TAILSCALE STATUS ===" -ForegroundColor Cyan

          & $tailscale status

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Could not obtain Tailscale status." -ForegroundColor Red
            exit $LASTEXITCODE
          }

      - name: Get Tailscale IPv4
        shell: powershell
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $tsIP = (& $tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
            Write-Host "Tailscale IPv4 was not returned." -ForegroundColor Red
            exit 1
          }

          Write-Host "Tailscale IPv4: $tsIP" -ForegroundColor Green

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
